<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow Guard Active</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #0b0e14;
        color: #e8e8f0;
      }
      .card {
        width: min(560px, 92vw);
        border-radius: 20px;
        border: 1px solid rgba(180, 97, 186, 0.35);
        background: rgba(180, 97, 186, 0.08);
        padding: 28px;
        box-shadow: 0 0 50px rgba(180, 97, 186, 0.15);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #c8c9d7;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Guard Active</h1>
      <p>Instagram and YouTube are blocked while your StudyFlow focus timer is running. Finish your session to restore access.</p>
    </main>
  </body>
</html>
